name: Playground

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy-playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@v1

      - run: npm ci
      # The lockfile was generated on macOS and lacks rollup's Linux binary
      # (npm/cli#4828), so vite build fails with "Cannot find module
      # @rollup/rollup-linux-x64-gnu". Install the one matching the locked rollup.
      - name: Install rollup Linux binary
        run: npm install --no-save "@rollup/rollup-linux-x64-gnu@$(node -p "require('./package-lock.json').packages['node_modules/rollup'].version")"
      - name: Build
        run: |
          cd playground
          npx vite build --base=/cooklang-rs/
        env:
          BUILD_COOKLANG_RS_VERSION: ${{ steps.ghd.outputs.describe }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/dist
