[package]
name = "cooklang"
version = "0.19.0"
edition = "2021"
authors = ["Zheoni <zheoni@outlook.es>"]
description = "Cooklang parser with opt-in extensions"
license = "MIT AND Unicode-3.0"
keywords = ["cooklang", "cooking", "recipes"]
categories = ["parser-implementations"]
repository = "https://github.com/cooklang/cooklang-rs"
readme = "README.md"

# Test fixtures and dev tooling a consumer never needs. The snapshots alone are
# ~700 KB; `.direnv` is a Nix symlink farm.
exclude = [
    "src/convert/locales/snapshots/**",
    ".direnv/**",
    "playground/**",
    "docs/**",
]

[dependencies]
bitflags = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }
strum = { version = "0.26.1", features = ["derive"] }
thiserror = "2"
enum-map = { version = "2", features = ["serde"] }
tracing = "0.1"
codesnake = "0.2.1"
unicode-width = "0.2"
finl_unicode = { version = "1.2", features = [
    "categories",
], default-features = false }
smallvec = { version = "1" }
unicase = "2.7.0"
indexmap = { version = "2", features = ["serde"] }
yansi = "1.0.1"
serde_yaml = "0.9.34"
toml = { version = "0.8", optional = true, features = ["preserve_order"] }
toml_edit = { version = "0.25", optional = true }
tsify = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
relative-path = { version = "2.0.1", features = ["serde"] }
icu_locale_core = { version = "2.3", features = ["alloc"] }

[dev-dependencies]
toml = "0.8"
serde_json = "1"
criterion = "0.5"
test-case = "3.2.1"
indoc = "2.0.3"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
prettyplease = { version = "0.3", optional = true }
quote = { version = "1", optional = true }
syn = { version = "3", optional = true }
proc-macro2 = { version = "1", optional = true }

[features]
default = ["aisle", "bundled_units", "shopping_list"]
bundled_units = ["toml", "prettyplease", "quote", "syn", "proc-macro2"]
aisle = []
shopping_list = []
pantry = ["toml", "toml_edit"]
ts = ["wasm-bindgen", "tsify"]

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "convert"
harness = false

[workspace]
members = [".", "typescript", "bindings", "fuzz", "xtask"]

[profile.release]
codegen-units = 1
strip = true
