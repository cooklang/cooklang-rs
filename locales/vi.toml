# Unit names for `vi`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `vi`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "L"
aliases = ["lít"]
long = { other = "{0} lít" }

[[unit]]
id = "deciliter"
symbol = "dL"
aliases = ["đềxilít"]
long = { other = "{0} đềxilít" }

[[unit]]
id = "centiliter"
symbol = "cL"
aliases = ["xentilít"]
long = { other = "{0} xentilít" }

[[unit]]
id = "milliliter"
symbol = "mL"
aliases = ["mililít"]
long = { other = "{0} mililít" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["kilôgam"]
long = { other = "{0} kilôgam" }

[[unit]]
id = "gram"
symbol = "g"
aliases = ["gam"]
long = { other = "{0} gam" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["mét"]
long = { other = "{0} mét" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["xentimét"]
long = { other = "{0} xentimét" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["milimét"]
long = { other = "{0} milimét" }

[[unit]]
id = "foot"
symbol = "ft"
aliases = ["feet"]
long = { other = "{0} feet" }

[[unit]]
id = "inch"
symbol = "inch"
long = { other = "{0} inch" }

[[unit]]
id = "second"
symbol = "giây"
long = { other = "{0} giây" }

[[unit]]
id = "minute"
symbol = "phút"
long = { other = "{0} phút" }

[[unit]]
id = "hour"
symbol = "giờ"
long = { other = "{0} giờ" }

[[unit]]
id = "day"
symbol = "ngày"
long = { other = "{0} ngày" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["độ C", "℃", "ºC", "C"]
long = { other = "{0} độ C" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["độ F", "℉", "ºF", "F"]
long = { other = "{0} độ F" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- muỗng cà phê
#   us tablespoon -- muỗng canh
#   us fluid ounce -- aoxơ chất lỏng, fl oz
#   us cup -- tách
#   us pint -- panh, pt
#   us quart -- qt, quart
#   us gallon -- gal, gallon
#   imperial fluid ounce -- Aoxơ chất lỏng theo hệ đo lường Anh, fl oz Anh
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- lít Anh
#   imperial gallon -- gal Anh, gallon Anh
#   metric dessert spoon -- thìa tráng miệng
#   metric cup -- cup khối, mc
#   ounce -- aoxơ, oz
#   pound -- lb, pao
