[[unit]]
id = "gram"
symbol = "ग्रा॰"
aliases = ["ग्राम"]
long = { one = "{0} ग्राम", other = "{0} ग्राम" }

[[unit]]
id = "meter"
symbol = "मी"
aliases = ["मीटर"]
long = { one = "{0} मीटर", other = "{0} मीटर" }

[[unit]]
id = "centimeter"
symbol = "सें॰मी॰"
aliases = ["सेंटीमीटर"]
long = { one = "{0} सेंटीमीटर", other = "{0} सेंटीमीटर" }

[[unit]]
id = "millimeter"
symbol = "मि॰मी॰"
aliases = ["मिलीमीटर"]
long = { one = "{0} मिलीमीटर", other = "{0} मिलीमीटर" }

[[unit]]
id = "foot"
symbol = "फ़ीट"
aliases = ["फ़ुट"]
long = { one = "{0} फ़ुट", other = "{0} फ़ीट" }

[[unit]]
id = "inch"
symbol = "इंच"
long = { one = "{0} इंच", other = "{0} इंच" }

[[unit]]
id = "second"
symbol = "से॰"
aliases = ["सेकंड"]
long = { one = "{0} सेकंड", other = "{0} सेकंड" }

[[unit]]
id = "minute"
symbol = "मि॰"
aliases = ["मिनट"]
long = { one = "{0} मिनट", other = "{0} मिनट" }

[[unit]]
id = "hour"
symbol = "घं॰"
aliases = ["घंटा", "घंटे"]
long = { one = "{0} घंटा", other = "{0} घंटे" }

[[unit]]
id = "day"
symbol = "दिन"
long = { one = "{0} दिन", other = "{0} दिन" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["डिग्री सेल्सियस", "°से॰", "℃", "ºC", "C"]
long = { one = "{0} डिग्री सेल्सियस", other = "{0} डिग्री सेल्सियस" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["डिग्री फ़ेरनहाइट", "°फ़ेरन", "℉", "ºF", "F"]
long = { one = "{0} डिग्री फ़ेरनहाइट", other = "{0} डिग्री फ़ेरनहाइट" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- टी स्पून
#   us tablespoon -- टेबलस्पून, टे॰ स्पून
#   us fluid ounce -- फ़्लूइड आउंस
#   us cup -- कप
#   us pint -- पाइंट
#   us quart -- क्वार्ट
#   us gallon -- गैलन
#   imperial fluid ounce -- fl oz Imp., इम्पी॰ फ़्लुइड आउंस
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- क. इम्पी., क्वार्ट इम्पीरियल
#   imperial gallon -- इम्पीरियल गैलन, इम्पी॰ गैलन
#   metric dessert spoon -- डे. स्पून, डेज़र्ट स्पून
#   metric cup -- मीट्रिक कप
#   ounce -- औंस
