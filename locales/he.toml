# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- כפיות, כפית, כפי׳
#   us tablespoon -- כפות, כפ׳
#   us fluid ounce -- fl oz, אונקיות נוזלים, אונקיית נוזלים
#   us cup -- כוס, כוסות, כ׳
#   us pint -- pt, פינט
#   us quart -- qt, קווארטה, קווארטות
#   us gallon -- גלון, גלונים, גל׳
#   imperial fluid ounce -- fl oz Imp., אונקיית נוזלים אימפריאלית
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- qt Imp., קווארט אימפריאלי, קווארטות אימפריאליות
#   imperial gallon -- גלון אימפריאלי, גלון בריטי
#   metric dessert spoon -- dstspn, כפיות קינוחים, כפית קינוחים
#   metric cup -- mc, כוס מידה מטרית, כ׳ מידה מטרית
