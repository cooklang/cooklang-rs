# Unit names for `he`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `he`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "one", condition = "i = 1 and v = 0 or i = 0 and v != 0" },
    { category = "other", condition = "" },
    { category = "two", condition = "i = 2 and v = 0" },
]

[[unit]]
id = "liter"
symbol = "ל׳"
aliases = ["ליטר"]
long = { many = "{0} ליטר", one = "{0} ליטר", other = "{0} ליטר", two = "{0} ליטר" }

[[unit]]
id = "deciliter"
symbol = "דצ״ל"
aliases = ["דציליטר"]
long = { many = "{0} דציליטר", one = "{0} דציליטר", other = "{0} דציליטר", two = "{0} דציליטר" }

[[unit]]
