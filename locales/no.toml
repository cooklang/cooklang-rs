# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
#   metric cup -- m. kopper, metrisk kopp, metriske kopper
#     `metrisk kopp` is marked, but it is a CLDR coinage rather than
#     Norwegian: a Norwegian recipe measures in desilitre and writes no cup of
#     any kind, as Swedish does not (line 563). Per the maintainer, it is not
#     used. CLDR's symbol was also the plural `m. kopper`, which could never
#     be an invariant symbol.
#   us fluid ounce -- væskeunse, væskeunser, fl oz
#     Unmarked US name (ADR 3): CLDR marks only `britiske væskeunser`.
#   us cup -- kopp, kopper, k
#     A Norwegian kaffekopp is 150 ml and a tekopp 250 ml (line 565); neither
#     is the US cup, and the bare word cannot pick between them.
#   us pint -- pint, pt
#     Unmarked US name (ADR 3): CLDR marks only `pt Imp.`.
#   us quart -- quart, qt
#     Unmarked US name (ADR 3): CLDR marks only `britiske quart`.
#   us gallon -- gallon, gal
#     Unmarked US name (ADR 3): CLDR marks only `britiske gallon`.
#   imperial fluid ounce -- britisk væskeunse, britiske væskeunser, imp. fl oz
#     A unit no Norwegian kitchen uses (ADR 3); written by identifier.
#   imperial pint -- pt Imp., pint Imp.
#     Root's English strings, not a Norwegian name.
#   imperial quart -- britisk quart, britiske quart, imp. quart
#     As the fluid ounce.
#   imperial gallon -- brit. gal, britisk gallon, britiske gallon
#     As the fluid ounce.
#   ounce -- unse, unser
#     Not in docs/research/cooking-units.md. Refused until researched.
#   pound -- pund
#     A Scandinavian pund is 500 g (line 566 for Denmark), not the avoirdupois
#     pound.
