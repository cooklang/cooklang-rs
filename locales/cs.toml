# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- lžiček, lžička, lžičky, tsp
#   us tablespoon -- lžic, lžíce, tbsp
#   us fluid ounce -- dutá unce, duté unce, dutých uncí, fl oz
#   us cup -- c, šálek, šálku, šálky, šálků
#   us pint -- pint, pinta, pinty, pt
#   us quart -- kvart, kvartu, kvarty, kvartů, qt
#   us gallon -- gal, galon, galonu, galony, galonů
#   imperial fluid ounce -- britská dutá unce, britské duté unce, britských
#     dutých uncí, fl oz Imp.
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- britské kvarty, britského kvartu, britský kvart,
#     britských kvartů, qt Imp.
#   imperial gallon -- britské galony, britského galonu, britský galon,
#     britských galonů, gal Imp.
#   metric dessert spoon -- dezertní lžička, dezertní lžičky, dezertních
#     lžiček, dstspn
#   metric cup -- mc, metrické šálky, metrického šálku, metrický šálek,
