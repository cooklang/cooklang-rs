# Unit names for `it`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `it`: what it names, what it refuses, and why.
#
# Some names here came from CLDR and are covered by the Unicode notice in
# locales/UNICODE-LICENSE. The rest were written or corrected by hand and are
# MIT. A `reason` explains a hand-authored entry; an entry without one may
# still have been edited by hand.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "many", condition = "e = 0 and i != 0 and i % 1000000 = 0 and v = 0 or e != 0..5" },
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litri", "litro"]
long = { one = "{0} litro", other = "{0} litri" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["decilitri", "decilitro"]
long = { one = "{0} decilitro", other = "{0} decilitri" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centilitri", "centilitro"]
long = { one = "{0} centilitro", other = "{0} centilitri" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["millilitri", "millilitro"]
long = { one = "{0} millilitro", other = "{0} millilitri" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["chilogrammi", "chilogrammo"]
long = { one = "{0} chilogrammo", other = "{0} chilogrammi" }

[[unit]]
id = "hectogram"
symbol = "hg"
aliases = ["etti", "etto", "ettogrammi", "ettogrammo"]
reason = """
The etto, 100 g, is how Italians buy cold cuts and cheese \
(docs/research/cooking-units.md line 495). CLDR carries no hectogram."""

[[unit]]
id = "gram"
symbol = "g"
aliases = ["grammi", "grammo"]
long = { one = "{0} grammo", other = "{0} grammi" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["metri", "metro"]
long = { one = "{0} metro", other = "{0} metri" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["centimetri", "centimetro"]
long = { one = "{0} centimetro", other = "{0} centimetri" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["millimetri", "millimetro"]
long = { one = "{0} millimetro", other = "{0} millimetri" }

[[unit]]
id = "foot"
symbol = "ft"
aliases = ["piede", "piedi"]
long = { one = "{0} piede", other = "{0} piedi" }

[[unit]]
id = "inch"
symbol = "in"
aliases = ["pollice", "pollici"]
long = { one = "{0} pollice", other = "{0} pollici" }

[[unit]]
id = "second"
symbol = "s"
aliases = ["secondi", "secondo"]
long = { one = "{0} secondo", other = "{0} secondi" }

[[unit]]
id = "minute"
symbol = "min"
aliases = ["minuti", "minuto"]
long = { one = "{0} minuto", other = "{0} minuti" }

[[unit]]
id = "hour"
symbol = "h"
aliases = ["ora", "ore"]
long = { one = "{0} ora", other = "{0} ore" }

[[unit]]
id = "day"
symbol = "giorni"
aliases = ["giorno"]
long = { one = "{0} giorno", other = "{0} giorni" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["gradi Celsius", "grado Celsius", "℃", "ºC", "C"]
long = { one = "{0} grado Celsius", other = "{0} gradi Celsius" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["gradi Fahrenheit", "grado Fahrenheit", "℉", "ºF", "F"]
long = { one = "{0} grado Fahrenheit", other = "{0} gradi Fahrenheit" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- cucchiai da tè, cucchiaio da tè, tsp
#   us tablespoon -- cucchiai da tavola, cucchiaio da tavola, tbsp
#   us fluid ounce -- fl oz, once liquide, oncia liquida
#   us cup -- c, tazza, tazze
#   us pint -- pinta, pinte, pt
#   us quart -- qt, quarti, quarto
#   us gallon -- gal, gallone, galloni
#   imperial fluid ounce -- fl oz imp., once liquide imperiali, oncia liquida
#     imperiale
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- imp qt, quarti imperiali, quarto imperiale
#   imperial gallon -- gal imp., gallone imperiale, galloni imperiali
#   metric dessert spoon -- cucchiaini da dessert, cucchiaino da dessert,
#     dstspn
#   metric cup -- mc, tazza metrica, tazze metriche
#   ounce -- once, oncia, oz
#   pound -- lb, libbra, libbre
