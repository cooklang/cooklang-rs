# Unit names for `en-AU`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `en-AU`: what it names, what it refuses, and why.
#
# Some names here came from CLDR and are covered by the Unicode notice in
# locales/UNICODE-LICENSE. The rest were written or corrected by hand and are
# MIT. A `reason` explains a hand-authored entry; an entry without one may
# still have been edited by hand.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = <date of the review>, by = "<role and place of the reviewer>", sources = ["https://www.womensweeklyfood.com.au/recipe/baking/small-batch-scones/", "https://www.donnahay.com.au/recipes/desserts-and-baking/almond-cake-with-vanilla-syrup", "https://www.sbs.com.au/food/recipe/strawberry-and-white-chocolate-picnic-cake/ox9smry5x"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litre", "litres", "L"]
long = { one = "{0} litre", other = "{0} litres" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["decilitre", "decilitres", "dL"]
long = { one = "{0} decilitre", other = "{0} decilitres" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centilitre", "centilitres", "cL"]
long = { one = "{0} centilitre", other = "{0} centilitres" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["millilitre", "millilitres", "mL"]
long = { one = "{0} millilitre", other = "{0} millilitres" }

[[unit]]
id = "us teaspoon"
symbol = "US tsp"
reason = "As en-001: the teaspoon is 5 ml; the 4.929 ml US spoon is marked."

[[unit]]
id = "us tablespoon"
symbol = "US tbsp"
reason = """
The Australian tablespoon is 20 ml; the 14.787 ml US spoon is marked."""

[[unit]]
id = "us fluid ounce"
symbol = "US fl oz"
aliases = ["US fluid ounce", "US fluid ounces"]
long = { one = "{0} US fluid ounce", other = "{0} US fluid ounces" }

[[unit]]
id = "us cup"
symbol = "US c"
reason = """
As en-001: the Australian cup is the 250 ml metric cup; the US one is \
marked."""

[[unit]]
id = "us pint"
symbol = "US pt"
reason = "As en-001: the pint is imperial; the US one is marked."

[[unit]]
id = "us quart"
symbol = "US qt"
aliases = ["US quart", "US quarts"]
long = { one = "{0} US quart", other = "{0} US quarts" }

[[unit]]
id = "us gallon"
symbol = "gal US"
aliases = ["US gallon", "US gallons"]
long = { one = "{0} US gallon", other = "{0} US gallons" }

[[unit]]
id = "imperial fluid ounce"
symbol = "fl oz Imp."
aliases = ["Imp. fluid ounce", "Imp. fluid ounces"]
long = { one = "{0} Imp. fluid ounce", other = "{0} Imp. fluid ounces" }

[[unit]]
id = "imperial pint"
symbol = "pt"
aliases = ["pint", "pints"]
long = { one = "{0} pint", other = "{0} pints" }

[[unit]]
id = "imperial quart"
symbol = "qt"
aliases = ["quart", "quarts"]
long = { one = "{0} quart", other = "{0} quarts" }

[[unit]]
id = "imperial gallon"
symbol = "gal."
aliases = ["gallon", "gallons", "gal"]
long = { one = "{0} gallon", other = "{0} gallons" }

[[unit]]
id = "metric teaspoon"
symbol = "tsp"
aliases = ["teaspoon", "teaspoons", "tsp."]
long = { one = "{0} teaspoon", other = "{0} teaspoons" }

[[unit]]
id = "metric tablespoon"
symbol = "metric tbsp"
aliases = ["metric tablespoon", "metric tablespoons"]
reason = """
In Australia `tbsp` is the 20 ml spoon, so the 15 ml one used everywhere \
else needs a marked name for recipes from New Zealand or the UK."""

[[unit]]
id = "metric cup"
symbol = "c"
aliases = ["cup", "cups", "metric cup", "metric cups"]
long = { one = "{0} cup", other = "{0} cups" }

[[unit]]
id = "australian tablespoon"
symbol = "tbsp"
aliases = ["tablespoon", "tablespoons", "tbsp.", "tbs", "tbs."]
long = { one = "{0} tablespoon", other = "{0} tablespoons" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["kilogram", "kilograms"]
long = { one = "{0} kilogram", other = "{0} kilograms" }

[[unit]]
id = "gram"
symbol = "g"
aliases = ["gram", "grams"]
long = { one = "{0} gram", other = "{0} grams" }

[[unit]]
id = "ounce"
symbol = "oz"
aliases = ["ounce", "ounces", "oz."]
long = { one = "{0} ounce", other = "{0} ounces" }

[[unit]]
id = "pound"
symbol = "lb"
aliases = ["pound", "pounds", "lb."]
long = { one = "{0} pound", other = "{0} pounds" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["metre", "metres"]
long = { one = "{0} metre", other = "{0} metres" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["centimetre", "centimetres"]
long = { one = "{0} centimetre", other = "{0} centimetres" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["millimetre", "millimetres"]
long = { one = "{0} millimetre", other = "{0} millimetres" }

[[unit]]
id = "foot"
symbol = "ft"
aliases = ["feet", "foot", "'"]
long = { one = "{0} foot", other = "{0} feet" }

[[unit]]
id = "inch"
symbol = "in"
aliases = ["inch", "inches", "\""]
long = { one = "{0} inch", other = "{0} inches" }

[[unit]]
id = "second"
symbol = "secs"
aliases = ["second", "seconds"]
long = { one = "{0} second", other = "{0} seconds" }

[[unit]]
id = "minute"
symbol = "mins"
aliases = ["minute", "minutes"]
long = { one = "{0} minute", other = "{0} minutes" }

[[unit]]
id = "hour"
symbol = "hrs"
aliases = ["hour", "hours"]
long = { one = "{0} hour", other = "{0} hours" }

[[unit]]
id = "day"
symbol = "days"
aliases = ["day"]
long = { one = "{0} day", other = "{0} days" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["degree Celsius", "degrees Celsius", "℃", "ºC", "C"]
long = { one = "{0} degree Celsius", other = "{0} degrees Celsius" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["degree Fahrenheit", "degrees Fahrenheit", "℉", "ºF", "F"]
long = { one = "{0} degree Fahrenheit", other = "{0} degrees Fahrenheit" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
#   metric dessert spoon -- US dessertspoon, US dessertspoons, US dstspn
#     As en-001: CLDR marks it US; no Australian dessertspoon value in the
#     research file.
#   metric cup -- mc
#     CLDR's abbreviation; no recipe writes it. The cup is `c`, `cup` or
#     `cups`.
#   imperial pint -- pt Imp., pint Imperial, pints Imperial
#     CLDR's marked labels, which no recipe writes. The pint is `pt`, `pint`
#     or `pints`.
