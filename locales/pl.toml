# Unit names for `pl`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `pl`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

reviewed = { date = 2026-10-06, by = "a polish speaker", sources = ["https://ania-gotuje.pl/przepis/szklanka-maki-cukru-cukru-pudru-ile-to-gram/", "https://aniagotuje.pl/przepis/golabki-tradycyjne"]}

plural_rules = [
    { category = "few", condition = "v = 0 and i % 10 = 2..4 and i % 100 != 12..14" },
    { category = "many", condition = "v = 0 and i != 1 and i % 10 = 0..1 or v = 0 and i % 10 = 5..9 or v = 0 and i % 100 = 12..14" },
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

