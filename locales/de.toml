# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
#   us fluid ounce -- Flüssigunze, Flüssigunzen, fl oz
#     Unmarked US name (ADR 0003): CLDR marks only `Imp. Flüssigunze`; 29.57
#     against 28.41 ml.
#   us cup -- Cups, Tasse, Tassen
#     A German Tasse is 150 ml, or 125 ml by some sources (lines 449, 619) —
#     far from the 236.588 ml US cup, and not the 250 ml metric cup either.
#   us pint -- Pint, Pints, pt
#     Unmarked US name (ADR 0003): CLDR marks only `pt Imp.`; 473 against 568
#     ml.
#   us quart -- Quart, Quarts, qt
#     Unmarked US name (ADR 0003): CLDR marks only `Imp. Quart`; 0.946 against
#     1.137 l.
#   us gallon -- Gallone, Gallonen, gal
#     Unmarked US name (ADR 0003): CLDR marks only `Imp. Gallone`; 3.785
#     against 4.546 l.
#   imperial fluid ounce -- Imp. Flüssigunze, Imp. Flüssigunzen, Imp.fl.oz.
#     A unit no German kitchen uses (ADR 0003); written by identifier.
#   imperial pint -- pt Imp., pint Imp.
#     As es: root's English strings, not a German name.
#   imperial quart -- Imp. Quart, Imp.qt.
#     As the fluid ounce.
#   imperial gallon -- Imp. Gallone, Imp. Gallonen, Imp. gal
#     As the fluid ounce.
#   metric dessert spoon -- Dessertlöffel, DL
#     No German value in docs/research/cooking-units.md. Refused until
#     researched.
#   pound -- Pfund
#     A German and Swiss Pfund is 500 g (line 445), still in informal use,
#     against the 453.592 g avoirdupois pound CLDR maps it to. Seeding this
#     would make a German recipe resolve 10% light, silently.
