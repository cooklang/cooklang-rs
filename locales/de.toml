[[unit]]
id = "decagram"
symbol = "dag"
aliases = ["Deka", "Dekagramm", "dkg"]
reason = """
The everyday Austrian unit for buying cold cuts and cheese: 10 g, listed \
as "Deka" in the Austrian Maß- und Eichgesetz §3(4) \
(docs/research/cooking-units.md line 446, source [88]). CLDR carries no \
decagram, and ADR 0004 declines to derive SI symbols, so it is authored \
where it is actually used."""

