#   us cup -- 杯, 量杯
#   us pint -- 品脫
#   us quart -- 夸脫
#   us gallon -- 加侖
#   imperial fluid ounce -- 英液盎司
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- 英制夸脫
#   imperial gallon -- 英制加侖
#   metric dessert spoon -- 甜品匙
#   metric cup -- 公制杯, 公制量杯
