[[unit]]
id = "gram"
symbol = "γρ."
aliases = ["γραμμάρια", "γραμμάριο"]
long = { one = "{0} γραμμάριο", other = "{0} γραμμάρια" }

[[unit]]
id = "meter"
symbol = "μ."
aliases = ["μέτρα", "μέτρο"]
long = { one = "{0} μέτρο", other = "{0} μέτρα" }

[[unit]]
id = "centimeter"
symbol = "εκ."
aliases = ["εκατοστά", "εκατοστό"]
long = { one = "{0} εκατοστό", other = "{0} εκατοστά" }

[[unit]]
id = "millimeter"
symbol = "χλστ."
aliases = ["χιλιοστόμετρα", "χιλιοστόμετρο"]
long = { one = "{0} χιλιοστόμετρο", other = "{0} χιλιοστόμετρα" }

[[unit]]
id = "foot"
symbol = "πδ"
aliases = ["πόδι", "πόδια"]
long = { one = "{0} πόδι", other = "{0} πόδια" }

[[unit]]
id = "inch"
symbol = "ίν."
aliases = ["ίντσα", "ίντσες"]
long = { one = "{0} ίντσα", other = "{0} ίντσες" }

[[unit]]
id = "second"
symbol = "δευτ."
aliases = ["δευτερόλεπτα", "δευτερόλεπτο"]
long = { one = "{0} δευτερόλεπτο", other = "{0} δευτερόλεπτα" }

[[unit]]
id = "minute"
symbol = "λ."
aliases = ["λεπτά", "λεπτό"]
long = { one = "{0} λεπτό", other = "{0} λεπτά" }

[[unit]]
id = "hour"
symbol = "ώ."
aliases = ["ώρα", "ώρες"]
long = { one = "{0} ώρα", other = "{0} ώρες" }

[[unit]]
id = "day"
symbol = "ημέρες"
aliases = ["ημέρα"]
long = { one = "{0} ημέρα", other = "{0} ημέρες" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["βαθμοί Κελσίου", "βαθμός Κελσίου", "℃", "ºC", "C"]
long = { one = "{0} βαθμός Κελσίου", other = "{0} βαθμοί Κελσίου" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["βαθμοί Φαρενάιτ", "βαθμός Φαρενάιτ", "℉", "ºF", "F"]
long = { one = "{0} βαθμός Φαρενάιτ", other = "{0} βαθμοί Φαρενάιτ" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- κ.γ., κουταλιά του γλυκού, κουταλιές του γλυκού
#   us tablespoon -- κ.σ., κουταλιά της σούπας, κουταλιές της σούπας
#   us fluid ounce -- fl oz, ουγγιά όγκου, ουγγιές όγκου
#   us cup -- κύπ., κύπελλα, κύπελλο
#   us pint -- πίντα, πίντες, πντ
#   us quart -- τέτ. γαλ., τέταρτα του γαλονιού, τέταρτο του γαλονιού
#   us gallon -- γαλ., γαλόνι, γαλόνια
#   imperial fluid ounce -- αγγλ. ουγγιές όγκου, αγγλοσαξονικές ουγγιές όγκου,
#     αγγλοσαξονική ουγγιά όγκου
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- αγγλ. τέτ. γαλ., αγγλοσαξονικά τέταρτα του γαλονιού,
#     αγγλοσαξονικό τέταρτο του γαλονιού
#   imperial gallon -- αγγλοσαξ. γαλόνια, αγγλοσαξονικά γαλόνια, αγγλοσαξονικό
#     γαλόνι
#   metric dessert spoon -- κ.φρ., κουταλιά φρούτου, κουταλιές φρούτου
#   metric cup -- μετρ. κύπελλα, μετρικά κύπελλα, μετρικό κύπελλο
#   ounce -- oz, ουγγιά, ουγγιές
#   pound -- λίβρα, λίβρες, λβ
