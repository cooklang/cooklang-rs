# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- c. à c., cuillère à café, cuillères à café
#   us tablespoon -- c. à s., cuillère à soupe, cuillères à soupe
#   us fluid ounce -- fl oz, once liquide, onces liquides
#   us cup -- tasse, tasses
#   us pint -- pinte, pintes, pte
#   us quart -- qt, quart, quarts
#   us gallon -- gal, gallon, gallons
#   imperial fluid ounce -- fl oz imp., once liquide impériale, onces liquides
#     impériales
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- qt imp., quart impérial, quarts impériaux
#   imperial gallon -- gal imp., gallon impérial, gallons impériaux
#   metric dessert spoon -- c. à d., cuillère à dessert, cuillères à dessert
#   metric cup -- tasse métrique, tasses métriques, tm
#   ounce -- once, onces, oz
#   pound -- lb, livre, livres
