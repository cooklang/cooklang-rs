# Unit names for `fr`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `fr`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "many", condition = "e = 0 and i != 0 and i % 1000000 = 0 and v = 0 or e != 0..5" },
    { category = "one", condition = "i = 0,1" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litre", "litres"]
long = { one = "{0} litre", other = "{0} litres" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["décilitre", "décilitres"]
long = { one = "{0} décilitre", other = "{0} décilitres" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centilitre", "centilitres"]
long = { one = "{0} centilitre", other = "{0} centilitres" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["millilitre", "millilitres"]
long = { one = "{0} millilitre", other = "{0} millilitres" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["kilogramme", "kilogrammes"]
long = { one = "{0} kilogramme", other = "{0} kilogrammes" }

[[unit]]
id = "gram"
symbol = "g"
aliases = ["gramme", "grammes"]
long = { one = "{0} gramme", other = "{0} grammes" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["mètre", "mètres"]
long = { one = "{0} mètre", other = "{0} mètres" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["centimètre", "centimètres"]
long = { one = "{0} centimètre", other = "{0} centimètres" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["millimètre", "millimètres"]
long = { one = "{0} millimètre", other = "{0} millimètres" }

[[unit]]
id = "foot"
symbol = "pi"
aliases = ["pied", "pieds"]
long = { one = "{0} pied", other = "{0} pieds" }

[[unit]]
id = "inch"
symbol = "po"
aliases = ["pouce", "pouces"]
long = { one = "{0} pouce", other = "{0} pouces" }

[[unit]]
id = "second"
symbol = "s"
aliases = ["seconde", "secondes"]
long = { one = "{0} seconde", other = "{0} secondes" }

[[unit]]
id = "minute"
symbol = "min"
aliases = ["minute", "minutes"]
