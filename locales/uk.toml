# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- ч. ложки, чайна ложка, чайних ложок, чайної ложки, чайні
#     ложки
#   us tablespoon -- cтолові ложки, ст. ложки, столова ложка, столових ложок,
#     столової ложки, столові ложки
#   us fluid ounce -- рід. унції, рідинна унція, рідинних унцій, рідинної
#     унції, рідинні унції
#   us cup -- чаш., чашка, чашки, чашок
#   us pint -- пінт, пінта, пінти
#   us quart -- квар., кварт, кварта, кварти
#   us gallon -- гал., галон, галона, галони, галонів
#   imperial fluid ounce -- англ. рід. унції, англійська рідинна унція,
#     англійських рідинних унцій, англійської рідинної унції, англійські
#     рідинні унції
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- англ. кварти, англійська кварта, англійських кварт,
#     англійської кварти, англійські кварти
#   imperial gallon -- англ. галона, англійський галон, англійських галонів,
#     англійського галона, англійські галони
#   metric dessert spoon -- дес. ложки, десертна ложка, десертних ложок,
#     десертної ложки, десертні ложки
#   metric cup -- метр. чашки, метрична чашка, метричних чашок, метричної
