# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- cc, colher de chá, colheres de chá
#   us tablespoon -- colher de sopa, colheres de sopa, cs
#   us fluid ounce -- fl oz, onça fluida, onças fluidas
#   us cup -- cháv., chávena, chávenas
#   us pint -- pint, pints, pt
#   us quart -- qt, quarto, quartos
#   us gallon -- gal, galão, galões
#   imperial fluid ounce -- onça fluida imperial, onças fluidas imp., onças
#     fluidas imperiais
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- quarto imperial, quartos imp., quartos imperiais
#   imperial gallon -- gal imp., galão imperial, galões imperiais
#   metric dessert spoon -- colher de sobremesa, colheres de sobremesa, csb
#   metric cup -- chám, chávena métrica, chávenas métricas
#   ounce -- onça, onças, oz
#   pound -- lb, libra, libras
