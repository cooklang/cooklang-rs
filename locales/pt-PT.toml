# Unit names for `pt-PT`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `pt-PT`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "many", condition = "e = 0 and i != 0 and i % 1000000 = 0 and v = 0 or e != 0..5" },
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litro", "litros"]
long = { one = "{0} litro", other = "{0} litros" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["decilitro", "decilitros"]
long = { one = "{0} decilitro", other = "{0} decilitros" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centilitro", "centilitros"]
long = { one = "{0} centilitro", other = "{0} centilitros" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["mililitro", "mililitros"]
long = { one = "{0} mililitro", other = "{0} mililitros" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["quilograma", "quilogramas"]
long = { one = "{0} quilograma", other = "{0} quilogramas" }

[[unit]]
id = "gram"
symbol = "g"
aliases = ["grama", "gramas"]
long = { one = "{0} grama", other = "{0} gramas" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["metro", "metros"]
long = { one = "{0} metro", other = "{0} metros" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["centímetro", "centímetros"]
long = { one = "{0} centímetro", other = "{0} centímetros" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["milímetro", "milímetros"]
long = { one = "{0} milímetro", other = "{0} milímetros" }

[[unit]]
id = "foot"
