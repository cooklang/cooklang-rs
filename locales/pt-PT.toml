[[unit]]
id = "inch"
symbol = "pol."
aliases = ["polegada", "polegadas"]
long = { one = "{0} polegada", other = "{0} polegadas" }

[[unit]]
id = "second"
symbol = "s"
aliases = ["segundo", "segundos"]
long = { one = "{0} segundo", other = "{0} segundos" }

[[unit]]
id = "minute"
