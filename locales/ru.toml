# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- ч. л., чайная ложка, чайной ложки, чайные ложки, чайных
#     ложек
#   us tablespoon -- ст. л., столовая ложка, столовой ложки, столовые ложки,
#     столовых ложек
#   us fluid ounce -- ам. жидк. унц., амер. жидкая унция, амер. жидкие унции,
#     амер. жидких унций, амер. жидкой унции
#   us cup -- ам. чаш., амер. чашек, амер. чашка, амер. чашки
#   us pint -- ам. пинт., амер. пинт, амер. пинта, амер. пинты
#   us quart -- ам. кварт., амер. кварт, амер. кварта, амер. кварты
#   us gallon -- ам. гал., амер. галлон, амер. галлона, амер. галлонов, амер.
#     галлоны
#   imperial fluid ounce -- имп. жидк. унц., имп. жидкая унция, имп. жидкие
#     унции, имп. жидких унций, имп. жидкой унции
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- имп. кварт, имп. кварт., имп. кварта, имп. кварты
#   imperial gallon -- имп. гал., имп. галлон, имп. галлона, имп. галлонов,
#     имп. галлоны
#   metric dessert spoon -- дес. л., десертная ложка, десертной ложки,
#     десертные ложки, десертных ложек
#   metric cup -- м. чаш., метрическая чашка, метрические чашки, метрических
#     чашек, метрической чашки
#   ounce -- унц., унции, унций, унция
#   pound -- фнт, фунт, фунта, фунтов, фунты
