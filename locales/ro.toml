#   us cup -- c, cană, căni, de căni
#   us pint -- de pinte, pinte, pintă, pt
#   us quart -- de quarte, qt, quart, quarte
#   us gallon -- de galoane, gal, galoane, galon
#   imperial fluid ounce -- de uncii lichide imperiale, fl oz imp., uncie
#     lichidă imperială, uncii lichide imperiale
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- de quarte imperiale, qt imp., quart imperial, quarte
