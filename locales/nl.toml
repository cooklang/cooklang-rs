# Unit names for `nl`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `nl`: what it names, what it refuses, and why.
#
# Some names here came from CLDR and are covered by the Unicode notice in
# locales/UNICODE-LICENSE. The rest were written or corrected by hand and are
# MIT. A `reason` explains a hand-authored entry; an entry without one may
# still have been edited by hand.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-10-06, by = "a native speaker, Lyon", sources = ["Larousse Gastronomique"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["liter"]
long = { one = "{0} liter", other = "{0} liter" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["deciliter"]
long = { one = "{0} deciliter", other = "{0} deciliter" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centiliter"]
long = { one = "{0} centiliter", other = "{0} centiliter" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["milliliter"]
long = { one = "{0} milliliter", other = "{0} milliliter" }

[[unit]]
id = "kilogram"
symbol = "kg"
aliases = ["kilogram"]
long = { one = "{0} kilogram", other = "{0} kilogram" }

[[unit]]
id = "hectogram"
symbol = "hg"
aliases = ["ons"]
reason = """
The Dutch ons is 100 g, defined in the 1820 metric system and still in \
informal use (docs/research/cooking-units.md line 471); it is not the \
28.35 g ounce, which CLDR's nl calls "ounce". CLDR carries no hectogram."""

[[unit]]
id = "gram"
symbol = "g"
aliases = ["gram"]
long = { one = "{0} gram", other = "{0} gram" }

[[unit]]
id = "meter"
symbol = "m"
aliases = ["meter"]
long = { one = "{0} meter", other = "{0} meter" }

[[unit]]
id = "centimeter"
symbol = "cm"
aliases = ["centimeter"]
long = { one = "{0} centimeter", other = "{0} centimeter" }

[[unit]]
id = "millimeter"
symbol = "mm"
aliases = ["millimeter"]
long = { one = "{0} millimeter", other = "{0} millimeter" }

[[unit]]
id = "foot"
symbol = "ft"
aliases = ["voet"]
long = { one = "{0} voet", other = "{0} voet" }

[[unit]]
id = "inch"
symbol = "in"
aliases = ["inch", "inches"]
long = { one = "{0} inch", other = "{0} inches" }

[[unit]]
id = "second"
symbol = "sec"
aliases = ["seconde", "seconden"]
long = { one = "{0} seconde", other = "{0} seconden" }

[[unit]]
id = "minute"
symbol = "min"
aliases = ["minuten", "minuut"]
long = { one = "{0} minuut", other = "{0} minuten" }

[[unit]]
id = "hour"
symbol = "uur"
long = { one = "{0} uur", other = "{0} uur" }

[[unit]]
id = "day"
symbol = "dagen"
aliases = ["dag"]
long = { one = "{0} dag", other = "{0} dagen" }

[[unit]]
id = "celsius"
symbol = "°C"
aliases = ["graad Celsius", "graden Celsius", "℃", "ºC", "C"]
long = { one = "{0} graad Celsius", other = "{0} graden Celsius" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

[[unit]]
id = "fahrenheit"
symbol = "°F"
aliases = ["graad Fahrenheit", "graden Fahrenheit", "℉", "ºF", "F"]
long = { one = "{0} graad Fahrenheit", other = "{0} graden Fahrenheit" }
reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
# No verdict yet. CLDR 48.2.3 offers these; a reviewer decides whether the
# word means this unit here, and if so it moves into a [[unit]] entry above.
#
#   us teaspoon -- theelepel, theelepels, tl
#   us tablespoon -- eetlepel, eetlepels, el
#   us fluid ounce -- fl oz, fluid ounce
#   us cup -- cup
#   us pint -- pint, pt
#   us quart -- qt, quart
#   us gallon -- gal, gallon
#   imperial fluid ounce -- Imp. fluid ounce, fl oz Imp.
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- imp. qt, imp. quart, imp. quarts
#   imperial gallon -- imp. gal, imp. gallon
#   metric dessert spoon -- des l, dessertlepel, dessertlepels
#   metric cup -- mc, metrische cup
#   ounce -- oz
#   pound -- lb
