# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
#   us fluid ounce -- fluid ounce, fluid ounces, flytande uns, fl oz
#     Unmarked US name (ADR 0003): CLDR marks only `Imp. fluid ounces`.
#   us cup -- kopp, koppar
#     A Swedish kopp is a coffee cup of 150 ml (line 558), and recipes measure
#     in dl; it is not the 236.588 ml US cup.
#   us pint -- pint, pt
#     Unmarked US name (ADR 0003): CLDR marks only `pt Imp.`; 473 against 568
#     ml.
#   us quart -- quart
#     Unmarked US name (ADR 0003): Swedish marks the imperial one `brittiska
#     quarts` and leaves this bare, so the bare word is the generic quart, 20%
#     ambiguous.
#   us gallon -- gallon, gal
#     Unmarked US name (ADR 0003): CLDR marks only `br. gallon`; 3.785 against
#     4.546 l.
#   imperial fluid ounce -- Imp. fluid ounce, Imp. fluid ounces, fl oz Imp.
#     English, not Swedish, and a unit no Swedish kitchen uses (ADR 0003).
#   imperial pint -- pt Imp., pint Imp.
#     Root's English strings, not a Swedish name.
#   imperial quart -- br. qt, br. quart, brittisk quart, brittiska quarts
#     A unit no Swedish kitchen uses (ADR 0003); written by identifier.
#   imperial gallon -- Br. gallon, br. gal, br. gallon
#     As the quart.
#   metric dessert spoon -- dessertsked, dessertskedar, dsk
#     No Swedish value in docs/research/cooking-units.md. Refused until
#     researched.
#   metric cup -- mcup, metrisk kopp, metriska koppar
#     `metrisk kopp` is marked, but it is a CLDR coinage rather than Swedish:
#     a Swedish recipe measures in decilitres and never writes a cup of any
#     kind (line 558, and the bare `kopp` is rejected above for being the 150
#     ml coffee cup). So the metric cup is left unnamed in sv and written
#     `metric cup`.
#   ounce -- uns
#     Not in docs/research/cooking-units.md. Refused until researched.
#   pound -- pund
#     The Swedish skålpund was 425 g (line 572) and a modern informal pund is
#     500 g; neither is the 453.592 g avoirdupois pound. CLDR offers no `lb`
#     here.
