# Unit names for `en-001`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `en-001`: what it names, what it refuses, and why.
#
# Some names here came from CLDR and are covered by the Unicode notice in
# locales/UNICODE-LICENSE. The rest were written or corrected by hand and are
# MIT. A `reason` explains a hand-authored entry; an entry without one may
# still have been edited by hand.

cldr_version = "48.2.3"

# NOT REVIEWED. Cooklang refuses to serve this locale: nobody who speaks the
# language has confirmed the names below are what its recipes write. See
# README.md -- it takes about twenty minutes and needs no programming.
#
# When someone has, record it here and the locale starts working:
#
#   reviewed = { date = 2026-11-17, by = "An english speaker", sources = ["https://odlums.ie/recipes/super-flour-classic-scones/", "https://www.rnz.co.nz/collections/recipes/budget-friendly-sticky-toffee-pudding", "https://edmondscooking.co.nz/how-tos/weights-measures"] }
#
# `by` is a role and a place, not a name or a handle: enough to judge the
# claim without putting a private individual in a public repository. `date` is
# a bare TOML date, not a quoted string.

plural_rules = [
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litre", "litres"]
long = { one = "{0} litre", other = "{0} litres" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["decilitre", "decilitres"]
long = { one = "{0} decilitre", other = "{0} decilitres" }

[[unit]]
id = "centiliter"
symbol = "cl"
aliases = ["centilitre", "centilitres"]
long = { one = "{0} centilitre", other = "{0} centilitres" }

[[unit]]
id = "milliliter"
symbol = "ml"
aliases = ["millilitre", "millilitres"]
long = { one = "{0} millilitre", other = "{0} millilitres" }

[[unit]]
id = "us teaspoon"
symbol = "US tsp"
reason = """
A Commonwealth teaspoon is 5 ml, so the bare `tsp` is the metric \
teaspoon; the 4.929 ml US spoon gets a marked symbol, like `US c` and \
`US pt`."""

[[unit]]
id = "us tablespoon"
symbol = "US tbsp"
reason = """
As the teaspoon: a Commonwealth tablespoon is 15 ml, the US one 14.787 \
ml."""

[[unit]]
id = "us fluid ounce"
symbol = "US fl oz"
aliases = ["US fluid ounce", "US fluid ounces"]
long = { one = "{0} US fluid ounce", other = "{0} US fluid ounces" }

[[unit]]
id = "us cup"
symbol = "US c"
reason = """
Outside the US a recipe's cup is the 250 ml metric cup, so adjudication \
rejects CLDR's bare `c` and `cup` for the US cup. Marked like CLDR's own \
en-001 `US qt`, `US gal` and `US fl oz`."""

[[unit]]
id = "us pint"
symbol = "US pt"
reason = """
A Commonwealth pint is the 568.26125 ml imperial pint, so adjudication \
rejects the bare `pt` and `pint` for the US pint. Marked like CLDR's own \
en-001 `US qt` and `US gal`."""

[[unit]]
id = "us quart"
symbol = "US qt"
aliases = ["US quart", "US quarts"]
long = { one = "{0} US quart", other = "{0} US quarts" }

[[unit]]
id = "us gallon"
symbol = "US gal"
aliases = ["US gallon", "US gallons"]
long = { one = "{0} US gallon", other = "{0} US gallons" }

[[unit]]
id = "imperial fluid ounce"
symbol = "fl oz"
aliases = ["fluid ounce", "fluid ounces"]
long = { one = "{0} fluid ounce", other = "{0} fluid ounces" }

[[unit]]
id = "imperial pint"
symbol = "pt"
aliases = ["pint", "pint Imperial", "pints", "pints Imperial", "pt Imp."]
long = { one = "{0} pint", other = "{0} pints" }

[[unit]]
id = "imperial quart"
symbol = "qt"
aliases = ["quart", "quarts"]
long = { one = "{0} quart", other = "{0} quarts" }

[[unit]]
id = "imperial gallon"
symbol = "gal"
aliases = ["gallon", "gallons"]
long = { one = "{0} gallon", other = "{0} gallons" }

[[unit]]
id = "metric teaspoon"
symbol = "tsp"
aliases = ["teaspoon", "teaspoons"]
long = { one = "{0} teaspoon", other = "{0} teaspoons" }

[[unit]]
id = "metric dessert spoon"
symbol = "dsp"
aliases = ["dessert spoon", "dessert spoons", "dessertspoon", "dessertspoons"]
reason = """
The 10 ml dessertspoon (docs/research/cooking-units.md lines 154, 622). \
CLDR's en-001 strings for its dessert spoon are the US one and are \
rejected."""

