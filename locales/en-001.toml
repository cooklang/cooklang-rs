reason = "The degree sign's other spellings, and the bare letter a cook types without it; `°C` is the symbol everywhere"

# Refused names. These do not resolve: a name resolves only by being listed
# above, so this is the record of why, not a mechanism.
#
#   metric dessert spoon -- US dessertspoon, US dessertspoons, US dstspn
#     CLDR marks the Commonwealth dessert spoon as the US one, and a US
#     dessertspoon is not what a British recipe means. The 10 ml `dsp` (line
#     154) is hand-authored in locales/en-001.toml.
