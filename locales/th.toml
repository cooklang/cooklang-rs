#   us gallon -- แกลลอน
#   imperial fluid ounce -- fl oz Imp., ฟลูอิดออนซ์ระบบอิมพีเรียล
#   imperial pint -- pint Imp., pt Imp.
#   imperial quart -- qt Imp., ควอร์ตอังกฤษ
#   imperial gallon -- แกลลอนอังกฤษ
#   metric dessert spoon -- ช้อนขนม
