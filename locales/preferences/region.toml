# A region's own rows, overriding its official system's for that quantity only. The systems are in system.toml, and
# the row schema is decision 5 in docs/adr/locale-aware-units.md.
#
# A region with no rows here gets its official system's: only the United States is US customary, everyone else is
# metric. An explicit `-u-ms-` selects a system and ignores these rows.
#
# No source states a switching threshold; every one here is inferred from how recipes are written in that place
# (`½ dl`, `0,25 ts`, `25 dkg`). Citations are into docs/research/best-units-by-region.md unless noted.

# --- Regions --------------------------------------------------------------

[[region]]
region = "SE"
quantity = "volume"
rows = [
    { unit = "liter", at_least = 1 },
    { unit = "deciliter", at_least = 0.5 },
    { unit = "metric tablespoon", at_least = 1 },
    { unit = "metric teaspoon", at_least = 0.5 },
    { unit = "nordic spice measure", at_least = 1 },
]
reason = """
§7.1 SE: Nordic kitchens measure in dl, with msk/tsk and the 1 ml krm below. \
52 ml would become `½ dl` where Livsmedelsverket wrote `3,5 msk`; the overlap \
zone is 3–4 spoons ≈ ½ dl and either is idiomatic. `10 dl vatten` also \
occurs, so `liter ≥ 1` is a choice, not a rule."""

