# Which unit a converted value is written in, for a reader who asked for a measurement system outright and for a
# region with no rows of its own. A region that has its own is in region.toml. The row schema and the rules around it
# are decision 5 in docs/adr/locale-aware-units.md.
#
# Time has one list, under metric, which every system shares.
#
# build.rs turns this file and region.toml into the PREFERENCES, LEGACY_PREFERENCES and REGION_PREFERENCES tables; a
# unit that is not in definitions.rs fails to compile.

# --- Systems --------------------------------------------------------------

[[system]]
system = "metric"
quantity = "volume"
rows = [
    { unit = "liter", at_least = 1 },
    { unit = "milliliter", at_least = 50 },
    { unit = "metric tablespoon", at_least = 1, fractions = 2 },
    { unit = "metric teaspoon", at_least = 0.25, fractions = 4 },
    { unit = "milliliter", at_least = 0 },
]
reason = """
Spoons for 5–45 ml: every metric region's recipes print them, bar mainland \
China and a few publishers (§7.3). Below a quarter teaspoon it is millilitres \
again, hence the second ml row as the floor. Bundled wrote 30 ml as `30 ml`; \
this is a recorded divergence (ADR 1). Half tablespoons and quarter \
teaspoons (`½ EL`, `¾ TL Salz`, §2 CH, DE); litres and millilitres stay \
decimal, `1,5 l` being how every metric publisher writes it. A region with \
volume rows of its own decides its own fractions there."""

[[system]]
system = "metric"
quantity = "mass"
rows = [{ unit = "kilogram", at_least = 1 }, { unit = "gram", at_least = 1 }, { unit = "milligram", at_least = 1 }]
reason = "Bundled's metric best list, unchanged."

[[system]]
system = "metric"
quantity = "length"
rows = [{ unit = "meter", at_least = 1 }, { unit = "centimeter", at_least = 1 }, { unit = "millimeter", at_least = 1 }]
reason = "Bundled's metric best list, unchanged."

[[system]]
system = "metric"
quantity = "temperature"
rows = [{ unit = "celsius", at_least = 1 }]
reason = "Bundled's metric best list, unchanged."

[[system]]
system = "metric"
quantity = "time"
rows = [{ unit = "day", at_least = 1 }, { unit = "hour", at_least = 1 }, { unit = "minute", at_least = 1 }, { unit = "second", at_least = 1 }]
reason = "Time does not vary by system; every system falls back to this row."

[[system]]
system = "us-customary"
quantity = "volume"
rows = [
    { unit = "us cup", at_least = 0.25, fractions = 4 },
    { unit = "us fluid ounce", at_least = 1, fractions = 2 },
    { unit = "us tablespoon", at_least = 1, fractions = 3 },
    { unit = "us teaspoon", at_least = 1, fractions = 8 },
]
reason = """
Stops at the cup, as bundled did: `4 cups`, not `1 quart`. The cup starts at a \
quarter, as the AU/NZ/CA rows do, because American recipes write ¼, ⅓ and ½ cup \
on every page; bundled reached the same only sideways, by capping tablespoons at \
four in its fractions config. The fluid ounce row is new; bundled wrote 4 fl oz \
of milk as `8 tbsp` (ADR 1, ADR 5). Fractions: quarters and thirds of a \
cup, half fluid ounces, thirds of a tablespoon (one teaspoon) and eighths of a \
teaspoon, the last two as units.toml's fractions config had them."""

[[system]]
system = "us-customary"
quantity = "mass"
rows = [{ unit = "pound", at_least = 1, fractions = 4 }, { unit = "ounce", at_least = 1, fractions = 4 }]
reason = """
Bundled's imperial best list, unchanged. Quarter pounds and quarter ounces; \
units.toml allowed eighths of a pound, but `1 1/8 lb` is a deli amount, and \
quarters send 500 g to `18 oz` as bundled wrote it."""

[[system]]
system = "us-customary"
quantity = "length"
rows = [{ unit = "foot", at_least = 1 }, { unit = "inch", at_least = 1, fractions = 4 }]
reason = "Bundled's imperial best list, unchanged. Quarter inches for tin sizes; feet are not kitchen amounts and stay decimal."

[[system]]
system = "us-customary"
quantity = "temperature"
rows = [{ unit = "fahrenheit", at_least = 1 }]
reason = "Bundled's imperial best list, unchanged."

[[system]]
system = "imperial"
quantity = "volume"
rows = [
    { unit = "imperial pint", at_least = 0.5, fractions = 4 },
    { unit = "imperial fluid ounce", at_least = 1, fractions = 2 },
    { unit = "metric tablespoon", at_least = 1, fractions = 2 },
    { unit = "metric teaspoon", at_least = 1, fractions = 4 },
]
reason = """
Stops at the pint for the same reason the US chain stops at the cup: `3 pints`, \
not `0.4 gal`. The pint starts at a half: BBC Food writes `275ml/½ pint` and \
`150ml/¼ pint` (best-units-by-region.md §7.4), and this system is opt-in, so \
the cost of being wrong is small. The spoons are metric because a British \
teaspoon is 5 ml (cooking-units.md lines 153, 155). Fractions: quarter and half \
pints as BBC Food prints them, half fluid ounces, half tablespoons and quarter \
teaspoons."""

[[system]]
system = "imperial"
quantity = "mass"
rows = [{ unit = "pound", at_least = 1, fractions = 4 }, { unit = "ounce", at_least = 1, fractions = 4 }]
reason = "Pound and ounce are avoirdupois in the UK too (cooking-units.md line 150). Quarters, as the US rows."

[[system]]
system = "imperial"
quantity = "length"
rows = [{ unit = "foot", at_least = 1 }, { unit = "inch", at_least = 1, fractions = 4 }]
reason = "Tin sizes are in inches (cooking-units.md line 152)."

[[system]]
system = "imperial"
quantity = "temperature"
rows = [{ unit = "celsius", at_least = 1 }]
reason = "UK ovens have been Celsius and gas mark for decades; Fahrenheit is the US system."

# --- Legacy ---------------------------------------------------------------
# What an untagged recipe is fitted with: units.toml's `best` lists, frozen,
# so that an untagged recipe does what it always did (ADR 7). On the
# metric side bundled chose the largest unit the amount reached a whole one
# of, so `at_least = 1`, and wrote decimals. On its "imperial" side, which is
# US customary, bundled first looked for a fraction in any best unit, with
# its per-unit denominators (tsp 8, tbsp 3, lb 8, else 4), so a unit was kept
# below one of it when a fraction fitted: `1/2 c`, `1/3 lb`. The thresholds
# below one reproduce that. When no fraction fitted anywhere, bundled wrote
# a decimal in the unit its threshold chose, `1.125 c`; the rows at one cup
# and two tablespoons are marked `or_decimal` to do the same instead of
# falling through to the next row as ADR 6 otherwise has it. Two, not
# one, because up to two tablespoons bundled still found a teaspoon
# fraction (`3 1/2 tsp`); beyond that the teaspoon's cap of five wholes
# ruled it out. Bundled's
# preference for a whole number in the smaller unit over a fraction in the
# larger (`4 tsp`, not `1 1/3 tbsp`; `24 oz`, not `1 1/2 lb`) is the search
# ADR 6 does not port, and the scaling differential lists what it
# changes. Never fractions for time or temperature.

[[legacy]]
system = "metric"
quantity = "volume"
rows = [{ unit = "liter", at_least = 1 }, { unit = "milliliter", at_least = 1 }]
reason = "units.toml: `best.metric = [\"ml\", \"l\"]`, `fractions.metric = false`."

[[legacy]]
system = "metric"
quantity = "mass"
rows = [{ unit = "kilogram", at_least = 1 }, { unit = "gram", at_least = 1 }, { unit = "milligram", at_least = 1 }]
reason = "units.toml: `best.metric = [\"mg\", \"g\", \"kg\"]`."

[[legacy]]
system = "metric"
quantity = "length"
rows = [{ unit = "meter", at_least = 1 }, { unit = "centimeter", at_least = 1 }, { unit = "millimeter", at_least = 1 }]
reason = "units.toml: `best.metric = [\"cm\", \"mm\", \"m\"]`."

[[legacy]]
system = "metric"
quantity = "temperature"
rows = [{ unit = "celsius", at_least = 1 }]
reason = "units.toml: `best.metric = [\"C\"]`, `fractions.quantity.temperature = false`."

[[legacy]]
system = "metric"
quantity = "time"
rows = [{ unit = "day", at_least = 1 }, { unit = "hour", at_least = 1 }, { unit = "minute", at_least = 1 }, { unit = "second", at_least = 1 }]
reason = "units.toml: `best = [\"s\", \"h\", \"min\", \"d\"]`, one list for both systems, `fractions.quantity.time = false`."

[[legacy]]
system = "us-customary"
quantity = "volume"
rows = [
    { unit = "us cup", at_least = 1, fractions = 4, or_decimal = true },
    { unit = "us cup", at_least = 0.3, fractions = 4 },
    { unit = "us tablespoon", at_least = 2, fractions = 3, or_decimal = true },
    { unit = "us tablespoon", at_least = 0.5, fractions = 3 },
    { unit = "us teaspoon", at_least = 0, fractions = 8 },
]
reason = "units.toml: `best.imperial = [\"cup\", \"tsp\", \"tbsp\"]`; `fractions.unit.tsp.max_denominator = 8`, `tbsp = 3`, cup the default 4. A third of a cup and half a tablespoon are the smallest fractions bundled kept in those units: a quarter cup was `4 tbsp` and two thirds of a tablespoon `2 tsp`, whole numbers winning its search."

[[legacy]]
system = "us-customary"
quantity = "mass"
rows = [{ unit = "pound", at_least = 1, fractions = 8 }, { unit = "ounce", at_least = 0, fractions = 4 }]
reason = "units.toml: `best.imperial = [\"oz\", \"lb\"]`; `fractions.unit.lb.max_denominator = 8`, ounce the default 4. Below a pound bundled kept the pound only for thirds, which the search decided; every other fraction of a pound is a whole number of ounces."

[[legacy]]
system = "us-customary"
quantity = "length"
rows = [{ unit = "foot", at_least = 1, fractions = 4 }, { unit = "inch", at_least = 0, fractions = 4 }]
reason = "units.toml: `best.imperial = [\"in\", \"ft\"]`, the default denominator 4."

[[legacy]]
system = "us-customary"
quantity = "temperature"
rows = [{ unit = "fahrenheit", at_least = 1 }]
reason = "units.toml: `best.imperial = [\"F\"]`, `fractions.quantity.temperature = false`."
