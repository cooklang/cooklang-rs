# Unit names for `fi`.
#
# Seeded once from CLDR 48.2.3 and hand-edited since. This file is the whole
# truth for `fi`: what it names, what it refuses, and why.
#
# A name with no `reason` came from CLDR and is covered by the Unicode
# notice in locales/UNICODE-LICENSE. Anything with a `reason` is
# hand-authored and MIT.

cldr_version = "48.2.3"

reviewed = { date = 2026-10-06, by = "Meänkieli speaker", sources = ["https://www.sverigesradio.se/artikel/leivo-sieki-eeva-fammun-vappumunkkia", "https://www.isof.se/nationella-minoritetssprak/meankieli/sprakframjande/ungdomssidan-meankieli/recept/recept/kangoskakor-kangosenkakot"] }

plural_rules = [
    { category = "one", condition = "i = 1 and v = 0" },
    { category = "other", condition = "" },
]

[[unit]]
id = "liter"
symbol = "l"
aliases = ["litra", "litraa", "litrat"]
long = { one = "{0} litra", other = "{0} litraa" }

[[unit]]
id = "deciliter"
symbol = "dl"
aliases = ["desilitra", "desilitraa", "desilitrat"]
long = { one = "{0} desilitra", other = "{0} desilitraa" }

[[unit]]
id = "centiliter"
